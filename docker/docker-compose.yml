# agent-mesh orchestrator + PostgreSQL (container deployment).
#
#   docker volume create agent-mesh-pg-data   # once, for a new installation
#   cp docker/.env.example docker/.env         # set token and PostgreSQL password
#   ./docker/build.sh
#   docker compose -f docker/docker-compose.yml up -d
#
# Production copies this file and its private .env to /opt/agent-mesh. The
# postgres volume can be an existing PG16 volume; only one postgres may mount it.

name: agent-mesh

services:
  postgres:
    image: ${AGENT_MESH_POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_mesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_mesh} -d ${POSTGRES_DB:-agent_mesh}"]
      interval: 5s
      timeout: 5s
      retries: 12

  orchestrator:
    image: ${AGENT_MESH_IMAGE:-agent-mesh:local}
    restart: unless-stopped
    # Existing /opt/agent-mesh/data is usually owned by root (systemd layout).
    user: "${AGENT_MESH_CONTAINER_USER:-0:0}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_MESH_DB_TYPE: pg
      AGENT_MESH_PG_HOST: postgres
      AGENT_MESH_PG_PORT: "5432"
      AGENT_MESH_PG_USER: ${POSTGRES_USER:-agent_mesh}
      AGENT_MESH_PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AGENT_MESH_PG_DATABASE: ${POSTGRES_DB:-agent_mesh}
      AGENT_MESH_TOKEN: ${AGENT_MESH_TOKEN:?set AGENT_MESH_TOKEN in .env}
      AGENT_MESH_HOST: 0.0.0.0
      AGENT_MESH_PORT: "8000"
      # db_path is unused for storage in PG mode but anchors <dir>/bootstrap.
      AGENT_MESH_DB_PATH: /data/agent-mesh.db
      AGENT_MESH_ARTIFACT_DIR: /data/artifacts
    ports:
      - "${AGENT_MESH_PORT:-8000}:8000"
    volumes:
      - ${AGENT_MESH_DATA_DIR:-/opt/agent-mesh/data}:/data

volumes:
  pgdata:
    external: true
    name: ${AGENT_MESH_PG_VOLUME:-agent-mesh-pg-data}
