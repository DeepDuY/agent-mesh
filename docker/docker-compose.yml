# agent-mesh orchestrator + PostgreSQL (container deployment).
#
#   cp docker/.env.example docker/.env    # set AGENT_MESH_TOKEN (+ POSTGRES_PASSWORD)
#   docker compose -f docker/docker-compose.yml up -d
#   # or, from inside docker/:  docker compose up -d
#
# The build context is the repository root (context: ..) and uses the same
# Dockerfile as docker/build.sh. For a quick SQLite-only run, see docker/run.sh.
# Docker only reads .dockerignore from the build-context root, so it stays at the
# repository root.

name: agent-mesh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_mesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_mesh}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_mesh} -d ${POSTGRES_DB:-agent_mesh}"]
      interval: 5s
      timeout: 5s
      retries: 12

  orchestrator:
    image: ${AGENT_MESH_IMAGE:-agent-mesh:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_MESH_DB_TYPE: pg
      AGENT_MESH_PG_HOST: postgres
      AGENT_MESH_PG_PORT: "5432"
      AGENT_MESH_PG_USER: ${POSTGRES_USER:-agent_mesh}
      AGENT_MESH_PG_PASSWORD: ${POSTGRES_PASSWORD:-agent_mesh}
      AGENT_MESH_PG_DATABASE: ${POSTGRES_DB:-agent_mesh}
      AGENT_MESH_TOKEN: ${AGENT_MESH_TOKEN:?set AGENT_MESH_TOKEN in docker/.env}
      AGENT_MESH_HOST: 0.0.0.0
      AGENT_MESH_PORT: "8000"
      # db_path is unused for storage in PG mode but anchors <dir>/bootstrap.
      AGENT_MESH_DB_PATH: /data/agent-mesh.db
      AGENT_MESH_ARTIFACT_DIR: /data/artifacts
    ports:
      - "${AGENT_MESH_PORT:-8000}:8000"
    volumes:
      - meshdata:/data

volumes:
  pgdata:
  meshdata:
